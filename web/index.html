<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nms-config-ui · 配置文件上传与下发</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>nms-config-ui</h1>
  <nav id="tabs">
    <button data-tab="nodes" class="active">节点</button>
    <button data-tab="files">配置文件库</button>
    <button data-tab="push">下发向导</button>
    <button data-tab="trace">下发留痕</button>
  </nav>
  <span id="conn" class="conn">…</span>
</header>

<main>
  <!-- 节点 -->
  <section id="tab-nodes" class="tab active">
    <div class="bar">
      <button id="nodes-reload" class="btn">刷新</button>
      <span class="hint">勾选节点后可带入下发向导；置灰行不可下发（router 走 SNMP 任务通道 / 未纳管等）。</span>
    </div>
    <table id="nodes-table">
      <thead><tr><th></th><th>ID</th><th>名称</th><th>管理 IP</th><th>类型</th><th>角色</th><th>状态</th><th>domain</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="bar">
      <span id="nodes-selected"></span>
      <button id="nodes-to-wizard" class="btn primary" disabled>带入下发向导 →</button>
    </div>
  </section>

  <!-- 配置文件库 -->
  <section id="tab-files" class="tab">
    <div class="bar">
      <button id="files-reload" class="btn">刷新</button>
      <details class="upload-box">
        <summary class="btn">上传 / 追加版本</summary>
        <div class="upload-form">
          <input type="file" id="up-file">
          <input type="text" id="up-name" placeholder="name（缺省=文件名；同名再传=追加版本）">
          <input type="text" id="up-desc" placeholder="描述（可选）">
          <button id="up-submit" class="btn primary">上传</button>
          <span id="up-result" class="hint"></span>
        </div>
      </details>
    </div>
    <table id="files-table">
      <thead><tr><th>名称</th><th>描述</th><th>最新版</th><th>大小</th><th>sha256</th><th>更新时间</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <div id="versions-box" class="versions"></div>
  </section>

  <!-- 下发向导 -->
  <section id="tab-push" class="tab">
    <div class="grid2">
      <div class="card">
        <h3>① 文件与目标</h3>
        <label>预设 <select id="preset-select"><option value="">— 选择常用组合 —</option></select>
          <button id="preset-del" class="btn slim" title="删除当前预设">删</button></label>
        <label>文件 <select id="push-file"></select></label>
        <label>版本 <select id="push-version"><option value="0">最新（受理时钉死）</option></select></label>
        <label>目标路径（节点上的绝对路径） <input type="text" id="push-path" placeholder="/etc/wireguard/wg0.conf"></label>
        <label>apply 命令（可选，原样单条 exec） <input type="text" id="push-apply" placeholder="systemctl restart wg-quick@wg0"></label>
        <div class="bar"><button id="preset-save" class="btn slim">存为预设</button>
          <span class="hint">预设在浏览器本地（localStorage）。</span></div>
      </div>
      <div class="card">
        <h3>② 目标节点</h3>
        <div class="bar">
          <button id="push-reload" class="btn slim">刷新</button>
          <button id="push-all-managed" class="btn slim">全选 managed VPS</button>
          <button id="push-clear" class="btn slim">清空</button>
        </div>
        <div id="push-nodes" class="nodepick"></div>
      </div>
    </div>
    <div class="bar">
      <button id="push-run" class="btn primary">执行下发（小并发 2）</button>
      <span id="push-summary" class="hint"></span>
    </div>
    <table id="push-results">
      <thead><tr><th>节点</th><th>结果</th><th>版本</th><th>sha256</th><th>耗时</th><th>说明 / 处置</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- 下发留痕 -->
  <section id="tab-trace" class="tab">
    <div class="bar">
      <label>节点 <select id="trace-node"></select></label>
      <button id="trace-reload" class="btn">查询</button>
    </div>
    <table id="trace-table">
      <thead><tr><th>#</th><th>文件</th><th>版本</th><th>结果</th><th>目标路径</th><th>apply</th><th>创建</th><th>完成</th><th>error_brief</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<!-- 内容读回 / 在线编辑 -->
<div id="editor" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <b id="ed-title">wg0.conf</b>
      <span id="ed-meta" class="hint"></span>
      <button class="btn slim" data-close>关闭</button>
    </div>
    <textarea id="ed-text" spellcheck="false"></textarea>
    <div class="bar">
      <button id="ed-download" class="btn slim">下载原文件</button>
      <button id="ed-save" class="btn primary" disabled>保存为新版本</button>
      <span id="ed-note" class="hint"></span>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>
<script src="app.js"></script>
</body>
</html>
