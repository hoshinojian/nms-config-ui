name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::gofmt 未格式化的文件："; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /dev/null .
